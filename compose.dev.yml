name: webpulse-dev

services:
  db:
    image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_DB: ${DB_NAME:-webpulse_dev}
      POSTGRES_USER: ${DB_USER:-webpulse_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a local DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_dev_data:

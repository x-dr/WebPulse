name: Build Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本，例如 0.1.0 或 0.1.0-rc.1（可带 v 前缀）'
        required: true
        type: string
      latest:
        description: '同时更新 latest 标签（仅正式版本）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml

  build:
    needs: acceptance
    name: Build and publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - name: Prepare image tags
        id: image
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.latest }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ || ${#version} -gt 128 ]]; then
            echo '::error::版本必须为 0.1.0 或 0.1.0-rc.1 这样的格式，且不超过 128 个字符。'
            exit 1
          fi
          if [[ "$PUBLISH_LATEST" == true && "$version" == *-* ]]; then
            echo '::error::预发布版本不能更新 latest 标签。'
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${TARGET}"
          {
            echo "name=$image"
            echo "version=$version"
            echo 'tags<<IMAGE_TAGS'
            echo "$image:$version"
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$PUBLISH_LATEST" == true ]]; then
              echo "$image:latest"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=webpulse-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=webpulse-${{ matrix.target }}

      - name: Write image summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s\n\n' "$IMAGE"
            printf -- '- Version: `%s:%s`\n' "$IMAGE" "$VERSION"
            printf -- '- Digest: `%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
            printf '\n```bash\ndocker pull %s@%s\n```\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

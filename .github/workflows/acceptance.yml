name: Acceptance and security

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: webpulse_ci
          POSTGRES_DB: webpulse_ci
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U webpulse_ci'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: webpulse_ci
      DB_USER: webpulse_ci
      DB_PASSWORD: isolated-ci-fixture
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm test && pnpm test:integration && pnpm test:postgres
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:sdk && pnpm test:e2e

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: webpulse-${{ matrix.target }}:acceptance
          cache-from: type=gha,scope=webpulse-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=webpulse-${{ matrix.target }}-${{ matrix.arch }}
      - name: Scan every production image before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: webpulse-${{ matrix.target }}:acceptance
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

  database-image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

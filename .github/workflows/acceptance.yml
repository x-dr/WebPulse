name: Acceptance and security

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: webpulse_ci
          POSTGRES_DB: webpulse_ci
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U webpulse_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_NAME: webpulse_ci
      DB_USER: webpulse_ci
      DB_PASSWORD: isolated-ci-fixture
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - run: npm install --global pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm test && pnpm test:integration && pnpm test:postgres
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:sdk && pnpm test:e2e

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, db]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: webpulse-${{ matrix.target }}:acceptance
          cache-from: type=gha,scope=webpulse-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=webpulse-${{ matrix.target }}-${{ matrix.arch }}
      - name: Verify database initialization and privilege drop
        if: matrix.target == 'db'
        shell: bash
        run: |
          set -euo pipefail
          container="webpulse-db-acceptance-${RANDOM}-${RANDOM}"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker run -d --name "$container" --platform linux/${{ matrix.arch }} \
            --mount type=tmpfs,destination=/var/lib/postgresql/data \
            -e POSTGRES_PASSWORD=isolated-ci-fixture \
            --health-cmd 'pg_isready -h 127.0.0.1 -U postgres' \
            --health-interval 1s --health-timeout 3s --health-retries 60 \
            webpulse-db:acceptance
          for attempt in {1..60}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == healthy ]]; then
              docker exec "$container" sh -c 'test "$(stat -c %u /proc/1)" = "$(id -u postgres)"'
              docker exec "$container" psql -U postgres -v ON_ERROR_STOP=1 -c 'SELECT 1'
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Scan every production image before publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: webpulse-${{ matrix.target }}:acceptance
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
